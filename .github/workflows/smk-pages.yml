name: Publish Felucca SMK
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: smk-pages
  cancel-in-progress: false
jobs:
  publish:
    if: github.repository == 'ChanceTheMaker/felucca-smk'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node web/test_analytics.mjs && node web/test_midi_input.mjs && node web/audio/test_smk_engine.mjs && node web/audio/test_smk_worklet.mjs
      - run: node web/test_midi_diagnostics.mjs && node web/test_smk37_handoff.mjs && node web/test_smk37_update.mjs && node web/test_smk37_public.mjs && sh tools/test_smk37_public.sh
      - run: python3 tools/make_smk_site.py build/smk-site
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: build/smk-site
      - uses: actions/deploy-pages@v4
        id: deploy
